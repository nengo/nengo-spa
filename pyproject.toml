[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nengo-spa"
dynamic = ["version"]
description = "An implementation of the Semantic Pointer Architecture for Nengo"
readme = "README.rst"
license = { text = "GNU General Public License, version 2" }
authors = [{ name = "Applied Brain Research", email = "info@appliedbrainresearch.com" }]
requires-python = ">=3.5"
dependencies = [
    #"nengo @ git+https://github.com/nengo/nengo.git@fix-numpy",
    "nengo",
    "numpy>=1.13,<=2.2.5",
]

[project.urls]
Homepage = "https://www.nengo.ai/nengo-spa"

[project.optional-dependencies]
all = [
    "jupyter<=1.1.1",
    "matplotlib>=2.0,<=3.9.4",
    "nbsphinx>=0.8.11,<=0.9.7",
    "nengo_sphinx_theme<=20.9",
    "numpydoc>=1.4.0",
    "scipy>=1.4.1,<=1.14.0",
    "scikit-learn<=1.6.1",
    "jupyter>=1.0.0,<=1.1.1",
    "matplotlib>=2.0,<=3.9.4",
    "nbformat>=5.0.7,<=5.10.4",
    "pytest>=3.6,<=8.3.5",
		"pytest-allclose~=1.0.0",
    "pytest-plt<=1.1.1",
    "pytest-rng<=1.0.0",
]

docs = [
    "jupyter<=1.1.1",
    "matplotlib>=2.0,<=3.9.4",
    "nbsphinx>=0.8.11,<=0.9.7",
    "nengo_sphinx_theme<=20.9",
    "numpydoc>=1.4.0",
]
optional = [
    "scipy>=1.4.1,<=1.13.1",
    "scikit-learn<=1.6.1",
]
tests = [
    "jupyter>=1.0.0,<=1.1.1",
    "matplotlib>=2.0,<=3.9.4",
    "nbformat>=5.0.7,<=5.10.4",
    "pytest>=3.6,<=8.3.5",
		"pytest-allclose~=1.0.0",
    "pytest-plt<=1.1.1",
    "pytest-rng<=1.0.0",
]


#[project.entry-points."nengo.backends"]
#reference = "nengo:Simulator"
#
#[project.entry-points."pytest11"]
#nengo_spa = "pytest_nengo_spa"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["nengo_spa._vendor"]

[tool.setuptools]
zip-safe = false
include-package-data = false
py-modules = ["pytest_nengo"]

#[tool.setuptools.package-data]
#nengo = ["nengo-data/nengorc"]

[tool.setuptools.dynamic]
version = { attr = "nengo_spa.version.version" }
